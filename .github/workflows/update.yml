name: Auto Update Screener Data

on:
  schedule:
    # Berjalan otomatis setiap Senin-Jumat jam 16:30 WIB (09:30 UTC)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

# Memberikan izin menulis (write) agar GitHub Actions bisa melakukan push ke repository
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Screener Script
        run: python screener.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          
          # Cek apakah ada perubahan pada data.json sebelum commit untuk mencegah Exit Code 128
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data pada data.json"
          else
            git commit -m "auto: update stock data from github pages"
            git push
          fi
