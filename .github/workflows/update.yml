name: Update Stock Screener

on:
  schedule:
    # Berjalan Senin-Jumat jam 10:00 WIB (03:00 UTC) dan 17:00 WIB (10:00 UTC)
    - cron: '0 3 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    # PERBAIKAN 1: Berikan izin write ke GitHub Token
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy

      - name: Run Screener
        run: python screener.py

      # PERBAIKAN 2: Handling penanganan git commit & push yang aman
      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          
          # Cek apakah ada perubahan pada data.json sebelum commit
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data hari ini."
          else
            git commit -m "Auto update screener results [skip ci]"
            git push
          fi
